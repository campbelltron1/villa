name: debug dice DDP hang
on:
  push:
    branches: [debug-ddp-hang]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: ./vesuvius
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Native dependency closure for the Python-only scikit-build
          # configurations of volume-cartographer (apps, UI tracer, flatboi,
          # tests: OFF) and vc_object_store (tools: OFF).
          # qt6-base-dev: utils links Qt6::Core (SFTP remote access, #1941).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libblosc-dev \
            libblosc2-dev \
            libboost-dev \
            libceres-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            liblz4-dev \
            libopencv-contrib-dev \
            libopencv-dev \
            libsuitesparse-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libzstd-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            qt6-base-dev \
            zlib1g-dev

      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Preserve downloaded wheels as well as built wheels; the ML stack
          # is expensive to download again. Never cache the virtualenv itself.
          prune-cache: false
          cache-suffix: debug-ddp-hang
          # Include transitive reader sources: volume-cartographer's own uv
          # wheel cache keys do not currently cover this sibling dependency.
          cache-dependency-glob: |
            .github/workflows/test-vesuvius.yml
            vesuvius/uv.lock
            vesuvius/pyproject.toml
            volume-cartographer/pyproject.toml
            vc_object_store/pyproject.toml
            vc_reader/**
            gpu_manager/pyproject.toml
            segmentation/models/batchgeneratorsv2/pyproject.toml
            segmentation/models/arch/nnunet/pyproject.toml

      - name: Sync dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: uv sync --extra all

      - name: Select Zarr version
        run: uv pip install "zarr==3.2.1" py-spy

      - name: Host and network facts
        run: |
          hostname; hostname -I || true; getent hosts "$(hostname)" || true; nproc; uv run --no-sync python -c "import sys,torch,multiprocessing as m;print(sys.version, torch.__version__, m.get_start_method())"

      - name: Control (main) vs patched dice DDP test, 25 runs each
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          PY="$(pwd)/.venv/bin/python"
          run() {  # $1 label, $2 test file; returns 0 ok, 1 fail, 2 hang
            setsid "$PY" -m pytest "$2" -q -p no:cacheprovider > run.log 2>&1 & pid=$!
            for s in $(seq 1 180); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            if kill -0 $pid 2>/dev/null; then echo "$1 HANG"; kill -9 -- -$pid; wait $pid; return 2; fi
            wait $pid; rc=$?; [ $rc -eq 0 ] && return 0; echo "$1 FAIL rc=$rc"; tail -30 run.log; return 1
          }
          declare -A n
          for i in $(seq 1 25); do
            run "main#$i" tests/models/training/test_dice_ddp_allgather.py; r=$?; n[main_$r]=$((n[main_$r]+1))
            run "patched#$i" tests/models/training/test_dice_ddp_allgather_fixed.py; r=$?; n[patched_$r]=$((n[patched_$r]+1))
          done
          echo "RESULT (0 ok, 1 fail, 2 hang):"; for k in "${!n[@]}"; do echo "RESULT $k=${n[$k]}"; done | sort
