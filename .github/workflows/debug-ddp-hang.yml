name: debug dice DDP hang
on:
  push:
    branches: [debug-ddp-hang]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: ./vesuvius
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Native dependency closure for the Python-only scikit-build
          # configurations of volume-cartographer (apps, UI tracer, flatboi,
          # tests: OFF) and vc_object_store (tools: OFF).
          # qt6-base-dev: utils links Qt6::Core (SFTP remote access, #1941).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libblosc-dev \
            libblosc2-dev \
            libboost-dev \
            libceres-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            liblz4-dev \
            libopencv-contrib-dev \
            libopencv-dev \
            libsuitesparse-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libzstd-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            qt6-base-dev \
            zlib1g-dev

      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Preserve downloaded wheels as well as built wheels; the ML stack
          # is expensive to download again. Never cache the virtualenv itself.
          prune-cache: false
          cache-suffix: debug-ddp-hang
          # Include transitive reader sources: volume-cartographer's own uv
          # wheel cache keys do not currently cover this sibling dependency.
          cache-dependency-glob: |
            .github/workflows/test-vesuvius.yml
            vesuvius/uv.lock
            vesuvius/pyproject.toml
            volume-cartographer/pyproject.toml
            vc_object_store/pyproject.toml
            vc_reader/**
            gpu_manager/pyproject.toml
            segmentation/models/batchgeneratorsv2/pyproject.toml
            segmentation/models/arch/nnunet/pyproject.toml

      - name: Sync dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: uv sync --extra all

      - name: Select Zarr version
        run: uv pip install "zarr==3.2.1" py-spy

      - name: Host and network facts
        run: |
          hostname; hostname -I || true; getent hosts "$(hostname)" || true; nproc; uv run --no-sync python -c "import sys,torch,multiprocessing as m;print(sys.version, torch.__version__, m.get_start_method())"

      - name: Dice DDP test alone, 15 times each way, stack dumps on a hang
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          SPY="$(pwd)/.venv/bin/py-spy"
          PY="$(pwd)/.venv/bin/python"
          cat > ../direct.py <<'EOF'
          import sys, pathlib; sys.path.insert(0, ".")
          import tests.models.training.test_dice_ddp_allgather as t
          import tempfile
          for name in ("memory_efficient", "soft"):
              t.test_batch_dice_under_ddp_matches_one_process(pathlib.Path(tempfile.mkdtemp()), name)
          print("direct ok", flush=True)
          EOF
          dumpgrp() {
            echo "### HANG: process tree"; ps -eo pid,ppid,pgid,stat,etimes,wchan:28,cmd --forest | grep -E "python|pytest|uv" | grep -v grep | cut -c1-260
            for p in $(pgrep -g "$1"); do echo "== pid $p :: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-200)"; sudo "$SPY" dump --pid $p --native 2>&1 | head -60; echo "-- threads wchan:"; for t in /proc/$p/task/*; do echo "$(basename $t) $(cat $t/comm) $(cat $t/wchan)"; done | head -30; done
          }
          run() {  # $1 label, rest = command
            label=$1; shift
            setsid "$@" > run.log 2>&1 & pid=$!
            for s in $(seq 1 90); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            if kill -0 $pid 2>/dev/null; then echo "$label HANG"; tail -20 run.log; dumpgrp $pid; kill -9 -- -$pid; wait $pid; return 2; fi
            wait $pid; rc=$?; [ $rc -eq 0 ] && return 0; echo "$label FAIL rc=$rc"; tail -30 run.log; return 1
          }
          declare -A n
          for i in $(seq 1 15); do
            run "pytest#$i" "$PY" -m pytest tests/models/training/test_dice_ddp_allgather.py -v -s -p no:cacheprovider -o faulthandler_timeout=60; r=$?; n[pytest$r]=$((n[pytest$r]+1))
            run "direct#$i" "$PY" ../direct.py; r=$?; n[direct$r]=$((n[direct$r]+1))
          done
          for k in "${!n[@]}"; do echo "$k=${n[$k]}"; done | sort   # 0 ok, 1 fail, 2 hang
