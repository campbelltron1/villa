name: debug dice DDP hang
on:
  push:
    branches: [debug-ddp-hang]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    defaults:
      run:
        shell: bash
        working-directory: ./vesuvius
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Native dependency closure for the Python-only scikit-build
          # configurations of volume-cartographer (apps, UI tracer, flatboi,
          # tests: OFF) and vc_object_store (tools: OFF).
          # qt6-base-dev: utils links Qt6::Core (SFTP remote access, #1941).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libblosc-dev \
            libblosc2-dev \
            libboost-dev \
            libceres-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            liblz4-dev \
            libopencv-contrib-dev \
            libopencv-dev \
            libsuitesparse-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libzstd-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            qt6-base-dev \
            zlib1g-dev

      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Preserve downloaded wheels as well as built wheels; the ML stack
          # is expensive to download again. Never cache the virtualenv itself.
          prune-cache: false
          cache-suffix: debug-ddp-hang
          # Include transitive reader sources: volume-cartographer's own uv
          # wheel cache keys do not currently cover this sibling dependency.
          cache-dependency-glob: |
            .github/workflows/test-vesuvius.yml
            vesuvius/uv.lock
            vesuvius/pyproject.toml
            volume-cartographer/pyproject.toml
            vc_object_store/pyproject.toml
            vc_reader/**
            gpu_manager/pyproject.toml
            segmentation/models/batchgeneratorsv2/pyproject.toml
            segmentation/models/arch/nnunet/pyproject.toml

      - name: Sync dependencies
        run: uv sync --extra all

      - name: Select Zarr version
        run: uv pip install "zarr==3.2.1" py-spy

      - name: Host and network facts
        run: |
          hostname; hostname -I || true; getent hosts "$(hostname)" || true; nproc; uv run --no-sync python -c "import sys,torch,multiprocessing as m;print(sys.version, torch.__version__, m.get_start_method())"

      - name: CI-order tests up to the dice DDP test, with stack dumps on a stall
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          SPY="$(pwd)/.venv/bin/py-spy"
          dump() { for p in $(pgrep -f -u "$USER" python); do echo "== pid $p ppid $(ps -o ppid= -p $p) :: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-300)"; sudo "$SPY" dump --pid $p 2>&1 | head -80; done; }
          ( sleep 300; if pgrep -f "pytest" >/dev/null; then echo "### dump at 300 s"; dump; fi; sleep 240; if pgrep -f "pytest" >/dev/null; then echo "### dump at 540 s"; dump; ps -eo pid,ppid,stat,etimes,wchan:24,cmd | grep -E "python|pytest" | cut -c1-250; fi ) > ../watchdog.txt 2>&1 &
          set +e
          timeout 600 uv run --no-sync pytest tests/data/test_affine.py tests/data/test_cube.py tests/data/test_vc_dataset_bbox.py tests/data/test_zarr_chunk_index.py tests/fiber_spline_generator/test_cleanup.py tests/fiber_spline_generator/test_cli.py tests/fiber_spline_generator/test_predict.py tests/fiber_spline_generator/test_splines.py tests/fiber_spline_generator/test_stitch.py tests/fiber_spline_generator/test_store.py tests/ink_detection/test_checkpoint_foundation.py tests/ink_detection/test_compile_fallback.py tests/ink_detection/test_config_foundation.py tests/ink_detection/test_curation_preprocessing.py tests/ink_detection/test_data_foundation.py tests/ink_detection/test_dependency_wiring.py tests/ink_detection/test_dino_guided_training.py tests/ink_detection/test_dynamic_labels.py tests/ink_detection/test_flat_inference.py tests/ink_detection/test_flat_inference_empty_chunks.py tests/ink_detection/test_flat_inference_ensemble.py tests/ink_detection/test_heldout_validation.py tests/ink_detection/test_inference_boundaries.py tests/ink_detection/test_inference_mps_copy.py tests/ink_detection/test_isotropic_input_preparation.py tests/ink_detection/test_label_zarr_preprocessing.py tests/ink_detection/test_loss_foundation.py tests/ink_detection/test_model_foundation.py tests/ink_detection/test_native_full3d_inference.py tests/ink_detection/test_numerical_foundation.py tests/ink_detection/test_roi_inference.py tests/ink_detection/test_roi_output_metadata.py tests/ink_detection/test_shipped_configs.py tests/ink_detection/test_training_artifacts.py tests/ink_detection/test_training_config.py tests/ink_detection/test_training_mps_copy.py tests/ink_detection/test_training_numerics.py tests/ink_detection/test_volume_io.py tests/install/test_windows_torch_cuda_source.py tests/models/configuration/test_config_manager.py tests/models/configuration/test_ps256_config_compat.py tests/models/datasets/test_cross_frame_dataset.py tests/models/datasets/test_find_valid_patches_plain_array.py tests/models/run/test_blend_finalize_bit_identity.py tests/models/run/test_blend_finalize_pipeline.py tests/models/run/test_finalize_multiclass_scale.py tests/models/run/test_finalize_uncovered_voxels.py tests/models/run/test_in_memory_blend.py tests/models/run/test_inference_chunk_cache.py tests/models/run/test_inference_legacy_checkpoint.py tests/models/run/test_inference_nnunet_normalization.py tests/models/run/test_inference_non_cuda_devices.py tests/models/run/test_inference_run_config_attrs.py tests/models/run/test_lock_file_exclusive.py tests/models/run/test_patch_writer.py tests/models/run/test_pipeline_cli.py tests/models/test_augment_on_device.py tests/models/test_load_nnunet_model.py tests/models/test_mps_conv3d.py tests/models/training/test_base_trainer.py tests/models/training/test_cli_schedule_defaults.py tests/models/training/test_cross_frame_smoke.py tests/models/training/test_dice_ddp_allgather.py  -m "not slow and not network" -p no:cacheprovider -o faulthandler_timeout=500
          echo "pytest rc=$?"
          wait
          cat ../watchdog.txt

      - name: Dice DDP test alone, 20 times
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          ok=0; hang=0; fail=0
          for i in $(seq 1 20); do
            timeout 120 uv run --no-sync pytest tests/models/training/test_dice_ddp_allgather.py -q -p no:cacheprovider > run.log 2>&1; rc=$?
            if [ $rc -eq 0 ]; then ok=$((ok+1)); elif [ $rc -eq 124 ]; then hang=$((hang+1)); echo "run $i HANG"; tail -5 run.log; else fail=$((fail+1)); echo "run $i FAIL"; tail -20 run.log; fi
          done
          echo "alone: ok=$ok hang=$hang fail=$fail"
