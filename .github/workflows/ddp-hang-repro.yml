name: ddp-hang-repro
on:
  push:
    branches: [ci-ddp-repro]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        zarr: ['2.18.7', '3.2.1']
    defaults:
      run:
        shell: bash
        working-directory: ./vesuvius
    steps:
      - name: Free runner disk (CUDA wheels need ~15 GB)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Native dependency closure for the Python-only scikit-build
          # configurations of volume-cartographer (apps, UI tracer, flatboi,
          # tests: OFF) and vc_object_store (tools: OFF).
          # qt6-base-dev: utils links Qt6::Core (SFTP remote access, #1941).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libblosc-dev \
            libblosc2-dev \
            libboost-dev \
            libceres-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            liblz4-dev \
            libopencv-contrib-dev \
            libopencv-dev \
            libsuitesparse-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libzstd-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            qt6-base-dev \
            zlib1g-dev

      - uses: astral-sh/setup-uv@v10.3.3
      - name: Sync dependencies
        run: uv sync --extra all
      - name: Select Zarr version and py-spy
        run: uv pip install "zarr==${{ matrix.zarr }}" py-spy
      - name: Loop the CI test suite; dump stacks on a stall
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          for i in $(seq 1 8); do
            echo "=== round $i $(date -u +%T)"
            uv run --no-sync pytest tests -m "not slow and not network" -p no:cacheprovider -q > round_$i.log 2>&1 &
            pid=$!
            for t in $(seq 1 600); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then
              echo "STALL in round $i after 600 s"; tail -5 round_$i.log
              for p in $(pgrep -f python); do echo "--- py-spy pid $p: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-200)"; sudo $(uv run --no-sync which py-spy) dump --native --pid $p; done
              ps -ef --forest | grep -v grep | grep -E "python|pytest" | cut -c1-250
              ls -la /tmp | head; pkill -9 -f pytest; pkill -9 -f multiprocessing
            else
              wait $pid; echo "round $i exit $? $(tail -1 round_$i.log)"
            fi
          done
